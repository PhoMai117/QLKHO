<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trạm Quét QC Túi - Sản Xuất</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-100 min-h-screen p-6">

    <div class="max-w-4xl mx-auto grid grid-cols-1 md:grid-cols-2 gap-6">
        
        <div class="bg-white p-6 rounded-xl shadow-md border border-slate-200 flex flex-col">
            <div class="flex justify-between items-center mb-4 border-b pb-2">
                <h1 class="text-lg font-bold text-slate-800">TRẠM QUÉT QC TÚI</h1>
                <button onclick="window.location.href='print_bags.html'" class="text-sm text-blue-600 hover:underline">Quay lại In Tem</button>
            </div>
            
            <p class="text-sm text-slate-500 mb-6" id="userInfo">Đang tải...</p>

            <div id="alertBox" class="hidden mb-4 p-4 rounded-lg text-center font-bold text-lg border-2"></div>

            <form id="scanForm" onsubmit="xuLyQuet(event)" class="mt-auto">
                <label class="block text-sm font-bold text-slate-700 mb-2">QUÉT MÃ QR TÚI VÀO ĐÂY:</label>
                <input type="text" id="inputBagId" required placeholder="Tít mã túi..." autofocus autocomplete="off"
                    class="w-full px-4 py-4 text-xl border-2 border-blue-400 rounded-lg focus:ring-4 focus:ring-blue-300 focus:outline-none uppercase font-mono text-center shadow-inner">
                <p class="text-xs text-center text-slate-400 mt-2">Súng quét sẽ tự động Enter sau khi quét</p>
            </form>
        </div>

        <div class="bg-white p-6 rounded-xl shadow-md border border-slate-200">
            <h2 class="text-lg font-bold text-slate-800 mb-4 border-b pb-2">Lịch sử QC thành công (Phiên này)</h2>
            <div class="overflow-y-auto h-96">
                <ul id="historyList" class="space-y-2">
                    <li class="text-sm text-slate-400 text-center mt-10" id="emptyMsg">Chưa quét mã nào...</li>
                </ul>
            </div>
            <div class="mt-4 text-right">
                <span class="text-sm font-bold text-slate-700">Tổng số lượng: <span id="totalScanned" class="text-blue-600 text-xl">0</span> túi</span>
            </div>
        </div>

    </div>

    <script>
        // Kiểm tra quyền
        const currentUser = JSON.parse(localStorage.getItem('currentUser'));
        if (!currentUser || currentUser.bo_phan !== 'Sản Xuất') {
            alert("Bạn không có quyền truy cập trang này!");
            window.location.href = '../login.html';
        } else {
            document.getElementById('userInfo').innerText = `Nhân viên: ${currentUser.ho_ten}`;
        }

        let tongSoLuong = 0;

        // Bắt sự kiện click ra ngoài thì tự focus lại vào input để không trượt cò súng
        document.body.addEventListener('click', (e) => {
            if (!['INPUT', 'BUTTON', 'A'].includes(e.target.tagName)) {
                document.getElementById('inputBagId').focus();
            }
        });

        async function xuLyQuet(event) {
            event.preventDefault(); 
            
            const inputField = document.getElementById('inputBagId');
            const bagId = inputField.value.trim().toUpperCase();
            const alertBox = document.getElementById('alertBox');
            
            inputField.value = ''; 
            inputField.focus();

            try {
                const res = await fetch('http://localhost:5000/api/production/verify-bag', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ bag_id: bagId })
                });
                const data = await res.json();

                alertBox.classList.remove('hidden', 'bg-green-100', 'text-green-700', 'border-green-500', 'bg-red-100', 'text-red-700', 'border-red-500');

                if (data.success) {
                    // Cảnh báo XANH
                    alertBox.classList.add('bg-green-100', 'text-green-700', 'border-green-500');
                    alertBox.innerText = `[OK] Túi ${bagId} ĐẠT CHUẨN!`;
                    
                    // Truyền trực tiếp bagId dạng chuỗi vào hàm vẽ lịch sử (Bỏ .bag_info)
                    themVaoLichSu(bagId);
                } else {
                    // Cảnh báo ĐỎ
                    alertBox.classList.add('bg-red-100', 'text-red-700', 'border-red-500');
                    alertBox.innerText = `[LỖI] ${data.message}`;
                }
            } catch (err) {
                // In lỗi thật sự ra cửa sổ Console (F12) để dễ gỡ lỗi
                console.error("LỖI THẬT SỰ LÀ:", err);
                alertBox.className = "mb-4 p-4 rounded-lg text-center font-bold text-lg border-2 bg-red-100 text-red-700 border-red-500";
                alertBox.innerText = "LỖI XỬ LÝ HOẶC KẾT NỐI SERVER!";
            }
        }

        function themVaoLichSu(bagIdStr) {
            const list = document.getElementById('historyList');
            const emptyMsg = document.getElementById('emptyMsg');
            if (emptyMsg) emptyMsg.remove();
            
            tongSoLuong++;
            document.getElementById('totalScanned').innerText = tongSoLuong;

            const li = document.createElement('li');
            li.className = "p-3 bg-slate-50 border border-slate-200 rounded-lg flex justify-between items-center";
            li.innerHTML = `
                <div>
                    <div class="font-bold text-blue-700">${bagIdStr}</div>
                    <div class="text-xs text-slate-500">Trạng thái: Bình thường</div>
                </div>
                <span class="text-green-600 font-bold text-sm">✔ OK</span>
            `;
            list.insertBefore(li, list.firstChild);
        }
    </script>
</body>
</html>
